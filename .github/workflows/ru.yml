name: Build RU firmware (ES3N28P)

on:
  workflow_dispatch:
  push:
    branches:
      - ci/**

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build freenove-esp32s3-display-2.8-lcd (ru-RU)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          set -o pipefail
          python scripts/build.py freenove-esp32s3-display-2.8-lcd \
            --name freenove-esp32s3-display-2.8-lcd \
            --language ru-RU \
            --wake-word wn9_alexa 2>&1 | tee build.log

      - name: Upload merged binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merged-binary-ru
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # merged-binary.bin stops before the end of the 8 MB assets partition, so the wake-word
      # models (srmodels.bin sits last in the pack) never reach the device through it.
      - name: Upload assets image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: assets-bin
          path: build/generated_assets.bin
          if-no-files-found: warn

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish log and binary to a rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -x
          ls -R out || true
          TAG=ci-latest
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "CI builds" \
              --notes "Rolling build of the ES3N28P firmware" || true
          fi
          if [ -f out/build-log/build.log ]; then
            gh release upload "$TAG" --repo "$REPO" --clobber out/build-log/build.log
          fi
          if [ -f out/merged-binary-ru/merged-binary.bin ]; then
            gh release upload "$TAG" --repo "$REPO" --clobber out/merged-binary-ru/merged-binary.bin
          fi
          if [ -f out/assets-bin/generated_assets.bin ]; then
            gh release upload "$TAG" --repo "$REPO" --clobber out/assets-bin/generated_assets.bin
          fi
